name: Import full tree

on:
  push:
    paths:
      - ".github/workflows/import-full.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCHIVE_URL: https://work-1-sotdiufphkethnrr.prod-runtime.all-hands.dev/cortex0.tar.gz
  ARCHIVE_SHA256: c0677ea200d38176cd1d37f715d5a3257c34e351bfef673a6039bcffce05567c

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify archive
        run: |
          set -euo pipefail
          curl -fsSL "$ARCHIVE_URL" -o /tmp/repo.tar.gz
          echo "$ARCHIVE_SHA256  /tmp/repo.tar.gz" | sha256sum -c -

      - name: Apply tree and push
        run: |
          set -euo pipefail
          mkdir -p /tmp/tree
          tar -xzf /tmp/repo.tar.gz -C /tmp/tree
          rsync -a --delete --exclude .git --exclude .github/workflows/import-full.yml /tmp/tree/ ./
          git config user.name "CORTEX-0 bot"
          git config user.email "cortex-0@frankenstein-labs.local"
          git add -A
          git commit -m "Import full CORTEX-0 implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
