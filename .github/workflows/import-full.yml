name: Import full tree

on:
  push:
    paths:
      - "bootstrap/part-*.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild tree and commit
        run: |
          set -euo pipefail
          count=$(ls bootstrap/part-*.b64 2>/dev/null | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "waiting for archive parts: $count/4"
            exit 0
          fi
          cat bootstrap/part-*.b64 | base64 -d > /tmp/repo.tar.gz
          mkdir -p /tmp/tree
          tar -xzf /tmp/repo.tar.gz -C /tmp/tree
          rsync -a --delete --exclude .git /tmp/tree/ ./
          rm -rf bootstrap
          git config user.name "CORTEX-0 bot"
          git config user.email "cortex-0@frankenstein-labs.local"
          git add -A
          git commit -m "Import full CORTEX-0 implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
