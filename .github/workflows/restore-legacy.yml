name: restore-legacy

on:
  push:
    paths:
      - .github/workflows/restore-legacy.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore tree from 942c0e0
        run: |
          git config user.name "Frankenstein-Labs"
          git config user.email "frankenstein-labs@users.noreply.github.com"
          git rm -rf .
          git checkout 942c0e0 -- .
          git commit -m "Restore full implementation (rewrite preserved on rewrite/tested-core)"
          git push origin HEAD:main
