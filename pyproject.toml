[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-0"
version = "0.1.0"
description = "CORTEX-0 — a small, from-scratch decoder-only language model with autonomous software around it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Frankenstein-Labs" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "tokenizers>=0.19",
  "safetensors>=0.4",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
data = ["pyarrow>=14", "datasets>=2.18"]
dev = ["pytest>=8", "pyarrow>=14", "httpx>=0.27", "fastapi>=0.110"]
all = ["cortex-0[serve,data,dev]"]

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that run a short real training loop",
]
