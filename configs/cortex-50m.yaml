# CORTEX-0 50M preset: designed for a single 16-24 GB GPU.
# Not trained in this repository; ready for reproducible runs.
model:
  vocab_size: 16384
  hidden_size: 640
  intermediate_size: 1728
  num_hidden_layers: 10
  num_attention_heads: 10
  num_key_value_heads: 5
  max_position_embeddings: 1024
  rms_norm_eps: 0.00001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  hidden_act: silu
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  batch_size: 12
  grad_accum_steps: 8
  max_steps: 40000
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 50
  log_interval: 20
  save_interval: 1000
  seed: 1337
  device: auto
  dtype: auto
  out_dir: checkpoints/cortex-50m
  tensorboard: true
  compile: false
  resume: true

train_data: datasets/processed/train.bin
val_data: datasets/processed/val.bin
tokenizer_dir: datasets/processed/tokenizer
