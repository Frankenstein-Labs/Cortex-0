# Controlled experiment: same tiny architecture, new French corpus v2 and 8192 BPE.
model:
  vocab_size: 8192
  hidden_size: 192
  intermediate_size: 512
  num_hidden_layers: 4
  num_attention_heads: 6
  num_key_value_heads: 6
  max_position_embeddings: 256
  rms_norm_eps: 0.00001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  hidden_act: silu
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  batch_size: 16
  grad_accum_steps: 1
  max_steps: 2000
  learning_rate: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 200
  log_interval: 50
  save_interval: 500
  seed: 20261122
  device: cpu
  dtype: float32
  out_dir: checkpoints/exp-tiny-v2-pretrain
  tensorboard: false
  compile: false
  resume: false

train_data: datasets/cortex-v2/train.bin
val_data: datasets/cortex-v2/val.bin
tokenizer_dir: datasets/cortex-v2/tokenizer
