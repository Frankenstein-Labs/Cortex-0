# CORTEX-0 150M preset: single 40-80 GB GPU or multi-GPU with DDP.
# Not trained in this repository; ready for reproducible runs.
model:
  vocab_size: 32768
  hidden_size: 1024
  intermediate_size: 2816
  num_hidden_layers: 12
  num_attention_heads: 16
  num_key_value_heads: 4
  max_position_embeddings: 2048
  rms_norm_eps: 0.00001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  hidden_act: silu
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  batch_size: 8
  grad_accum_steps: 16
  max_steps: 80000
  learning_rate: 0.0002
  min_lr_ratio: 0.1
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 50
  log_interval: 20
  save_interval: 1000
  seed: 1337
  device: auto
  dtype: auto
  out_dir: checkpoints/cortex-150m
  tensorboard: true
  compile: false
  resume: true

train_data: datasets/processed/train.bin
val_data: datasets/processed/val.bin
tokenizer_dir: datasets/processed/tokenizer
