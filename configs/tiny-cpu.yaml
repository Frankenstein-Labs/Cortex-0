# CORTEX-0 tiny CPU preset: the checkpoint trained inside this repository.
# ~2.6M parameters, 256-token context. Small enough to train on 4 CPU cores.
model:
  vocab_size: 4096
  hidden_size: 192
  intermediate_size: 512
  num_hidden_layers: 4
  num_attention_heads: 6
  num_key_value_heads: 6
  max_position_embeddings: 256
  rms_norm_eps: 0.00001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  hidden_act: silu
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  batch_size: 16
  grad_accum_steps: 1
  max_steps: 3000
  learning_rate: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 150
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 300
  eval_steps: 20
  log_interval: 50
  save_interval: 750
  seed: 1337
  device: auto
  dtype: auto
  out_dir: checkpoints/tiny-cpu
  tensorboard: false
  compile: false
  resume: true

train_data: datasets/processed/train.bin
val_data: datasets/processed/val.bin
tokenizer_dir: datasets/processed/tokenizer
